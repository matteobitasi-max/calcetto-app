    <div style="font-size: 44px">📡</div>
    <h1 id="titolo">Nessuna connessione</h1>
    <p id="testo">The Cap ha bisogno di internet. Controlla Wi‑Fi o dati mobili e riprova.</p>
    <button id="pulsante" onclick="riprova()">Riprova</button>
    <small id="stato"></small>
    <script>
      // l'indirizzo del sito, lo stesso di capacitor.config.ts
      var SITO = 'https://www.thecapfc.app/'
      // in inglese se il telefono non è in italiano (qui non si vede la lingua scelta nell'app)
      var inglese = !/^it\b/i.test(navigator.language || 'it')
      if (inglese) {
        document.documentElement.lang = 'en'
        document.getElementById('titolo').textContent = 'No connection'
        document.getElementById('testo').textContent = 'The Cap needs the internet. Check Wi‑Fi or mobile data and try again.'
        document.getElementById('pulsante').textContent = 'Try again'
      }
      function riprova() {
        document.getElementById('stato').textContent = inglese ? 'Retrying…' : 'Riprovo…'
        location.replace(SITO)
      }
      // appena torna la connessione si riprova da solo, e comunque ogni 10 secondi
      window.addEventListener('online', riprova)
      setInterval(riprova, 10000)
      // il motivo (dall'app: es. "NSURLErrorDomain -1009"), in piccolo
      var errore = new URLSearchParams(location.search).get('errore')
      if (errore) document.getElementById('stato').textContent = errore
    </script>
  </body>
