<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Cap</title>
    <!-- Mostrata dall'app (server.errorPath) quando il sito non si carica: di solito manca internet. -->
    <style>
      body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: 14px; font-family: -apple-system, system-ui, sans-serif; background: #f4faf4; color: #18181b; text-align: center;
             padding: 24px; box-sizing: border-box; }
      img { width: 96px; height: 96px; border-radius: 22%; box-shadow: 0 6px 20px rgba(0, 0, 0, .15); }
      h1 { margin: 8px 0 0; font-size: 24px; }
      p { margin: 0; max-width: 300px; color: #52525b; line-height: 1.4; }
      button { margin-top: 10px; padding: 14px 32px; border: 0; border-radius: 12px; background: #16a34a; color: #fff; font-size: 17px; font-weight: 600; }
      small { color: #a1a1aa; }
      @media (prefers-color-scheme: dark) { body { background: #0a0a0a; color: #fafafa; } p { color: #a1a1aa; } }
    </style>
  </head>
  <body>
    <img src="icon.png" alt="" />
    <div style="font-size: 44px">📡</div>
    <h1>Nessuna connessione</h1>
    <p>The Cap ha bisogno di internet. Controlla Wi‑Fi o dati mobili e riprova.</p>
    <button onclick="riprova()">Riprova</button>
    <small id="stato"></small>
    <script>
      // l'indirizzo del sito, lo stesso di capacitor.config.ts
      var SITO = 'https://calcetto-app-brown.vercel.app/'
      function riprova() {
        document.getElementById('stato').textContent = 'Riprovo…'
        location.replace(SITO)
      }
      // appena torna la connessione si riprova da solo
      window.addEventListener('online', riprova)
    </script>
  </body>
</html>
